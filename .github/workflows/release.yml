name: "Release"

# Stages a release on npm when a version lands on main. `develop` is merged into
# main through a PR as usual; that merge is what triggers this.
#
# Nothing is staged unless the version in package.json is one npm does not
# already have, so re-running or merging again is a no-op rather than an error.
#
# Two gates, and they check different things. The "release" environment asks
# whether this run should happen at all - give it a required reviewer in repo
# settings. Staging then puts the package in the registry without making it
# public, so the tarball that would reach users can be inspected before it does:
#
#   npm stage list paymcp        # find the stage id
#   npm stage download <id>      # inspect what would ship
#   npm stage approve <id>       # publish it (asks for 2FA)
#
# Until that approval the version is not installable.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: "check version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: v
        name: Compare package.json version against npm
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # An unpublished package has no versions at all; treat that as "new".
          # A *staged* version is not public and so is invisible here - the
          # publish job checks for that separately.
          PUBLISHED=$(npm view "${NAME}" versions --json 2>/dev/null || echo '[]')
          if node -e "process.exit(JSON.parse(process.argv[1]).includes(process.argv[2]) ? 0 : 1)" "$PUBLISHED" "$VERSION"; then
            echo "${NAME} ${VERSION} is already on npm - nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "${NAME} ${VERSION} is new - will stage"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: "stage ${{ needs.check.outputs.version }}"
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Approval gate. Also the place to scope npm trusted publishing to.
    environment: release
    permissions:
      contents: write   # create the tag and the draft Release
      id-token: write   # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: npm install -g pnpm@10.12.4

      - uses: actions/setup-node@v7
        with:
          # Node 22 so npm is new enough for trusted publishing; the test job
          # still runs on 18, which is what the package supports.
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports staged publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The PR gate already ran these, but a release is worth re-proving on the
      # exact commit being shipped.
      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Look for an already staged version
        id: staged
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -uo pipefail
          NAME=$(node -p "require('./package.json').name")
          # Best effort. A staged version occupies the same version index as a
          # published one, so staging it twice fails; catching it here turns that
          # into a clear skip. If this cannot authenticate it prints nothing and
          # we fall through to npm's own error, which says the same thing.
          LIST=$(npm stage list "${NAME}" --json 2>/dev/null || echo '[]')
          if printf '%s' "$LIST" | grep -q "\"${VERSION}\""; then
            echo "${NAME} ${VERSION} is already staged and waiting for approval"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage on npm
        if: steps.staged.outputs.already != 'true'
        # With trusted publishing configured on npmjs.com this needs no secret.
        # If you use an automation token instead, add it as the NPM_TOKEN secret
        # and it takes precedence; leaving it unset falls back to OIDC.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --access public

      - name: Tag and draft the GitHub Release
        if: steps.staged.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # The section for this version, up to the next "# <number>" heading.
          awk -v want="# ${VERSION}" '
            $0 == want { found = 1; next }
            found && /^# [0-9]/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for ${VERSION}." > notes.md
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          # Draft, because the package is staged and not installable yet.
          # Publish this release once the staged version is approved.
          gh release create "v${VERSION}" --draft --title "v${VERSION}" --notes-file notes.md

      - name: What happens next
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          echo "::notice::${VERSION} is staged, not published. Approve it with 'npm stage approve', then publish the draft GitHub Release."
